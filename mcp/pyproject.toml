[project]
name = "codebase-kg"
version = "0.16.0"
description = "Local MCP server over a per-repo committed code_graph.db — a SQLite map of a codebase (nodes, symbol anchors, edges) exposed to agents as deterministic typed queries with full-text search."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Alexk413x", email = "alexk413x@gmail.com" }]
license = { text = "LicenseRef-No-Resale-1.0" }
# The server, the hooks and the CLIs import only the standard library.
dependencies = []

[project.scripts]
codebase-kg = "codebase_kg.daemon:main"
# Git's textconv driver calls this with one path and expects JSON on stdout, so
# a committed code_graph.db renders as a readable diff instead of "Binary files
# differ". Its own entry point because git invokes a command, not a module.
codebase-kg-export = "codebase_kg.export:main"
# The build and migrate CLIs keep entry points so an installed package can run
# them by name. Skills use mcp/launch/kg_cli.py, which needs no install.
codebase-kg-build = "codebase_kg.build:main"
codebase-kg-migrate = "codebase_kg.migrate:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codebase_kg"]

[dependency-groups]
dev = [
    # The tool definitions in server.py, the catalog generator, the tests and the benchmarks.
    # fastmcp needs Python 3.10+; on 3.9 the server tests that import it are skipped.
    "fastmcp>=4.0.3,<5; python_full_version >= '3.10'",
    "pytest>=8,<10",
    "pyright>=1.1.400",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
include = ["src", "tests", "scripts"]
# The vendored pre-push checker lives outside the package on purpose (it must
# copy into repos that have no plugin install); tests import it by path.
extraPaths = ["../git-hooks", "../hooks"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.9"
typeCheckingMode = "standard"
