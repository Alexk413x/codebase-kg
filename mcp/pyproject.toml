[project]
name = "codebase-kg"
version = "0.5.4"
description = "Local stdio MCP server over a per-repo committed code_graph.db — a SQLite map of a codebase (nodes, symbol anchors, edges) exposed to agents as deterministic typed queries with full-text search."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Alexk413x", email = "alexk413x@gmail.com" }]
license = { text = "LicenseRef-Proprietary" }
dependencies = [
    "fastmcp>=3.3,<4",
]

[project.scripts]
codebase-kg = "codebase_kg.server:main"
# Git's textconv driver calls this with one path and expects JSON on stdout, so
# a committed code_graph.db renders as a readable diff instead of "Binary files
# differ". Its own entry point because git invokes a command, not a module.
codebase-kg-export = "codebase_kg.export:main"
# The build and migrate CLIs need entry points for the same reason the
# exporter does: a target repo has the plugin but not an importable
# codebase_kg, so `python -m codebase_kg.build` is a ModuleNotFoundError
# there. With these, `uvx --from <plugin>/mcp codebase-kg-build` works
# from any repo. kg_stats reports the exact invocation.
codebase-kg-build = "codebase_kg.build:main"
codebase-kg-migrate = "codebase_kg.migrate:main"

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codebase_kg"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pyright>=1.1.400",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
include = ["src", "tests"]
# The vendored pre-push checker lives outside the package on purpose (it must
# copy into repos that have no plugin install); tests import it by path.
extraPaths = ["../git-hooks", "../hooks"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
typeCheckingMode = "standard"
