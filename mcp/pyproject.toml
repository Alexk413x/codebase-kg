[project]
name = "codebase-kg"
version = "0.1.0"
description = "Local stdio MCP server that parses a per-repo KNOWLEDGE_GRAPH.md (markdown source of truth) into a queryable graph and exposes it to agents as deterministic typed queries."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Alexk413x", email = "alexk413x@gmail.com" }]
license = { text = "MIT" }
dependencies = [
    "fastmcp>=2.0,<4",
]

[project.scripts]
codebase-kg = "codebase_kg.server:main"

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codebase_kg"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pyright>=1.1.400",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
