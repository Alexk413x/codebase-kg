name: Release branch

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-branch
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Build only when the release branch holds another version
        id: version
        run: |
          version=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          git fetch -q --depth=1 origin release:refs/remotes/origin/release || true
          released=$(git show origin/release:.claude-plugin/plugin.json 2>/dev/null | python3 -c "import json, sys; print(json.load(sys.stdin)['version'])" 2>/dev/null || true)
          if [ "$released" = "$version" ]; then
            echo "The release branch holds $version, so main holds changes that are not released. Bump the version to release them."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the release branch without development files
        if: steps.version.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B release
          git rm -r -q .codex .github/workflows .gitignore ruff.toml docs evals mcp/tests mcp/bench mcp/scripts
          # The marker makes this build a release: only a release replaces an older server on the shared port.
          version=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          printf '%s %s\n' "$version" "$GITHUB_SHA" > mcp/src/codebase_kg/RELEASE
          git add -f mcp/src/codebase_kg/RELEASE
          git commit -q -m "Release build of ${GITHUB_SHA::7}"
          git cat-file -e HEAD:mcp/src/codebase_kg/RELEASE
          git push -f origin release
      - name: Tag the release build if the version has no tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          tag="codebase-kg--v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag exists"
            exit 0
          fi
          git fetch -q --depth=1 origin +release:refs/remotes/origin/release
          released=$(git show origin/release:.claude-plugin/plugin.json | python3 -c "import json, sys; print(json.load(sys.stdin)['version'])")
          if [ "$released" != "$version" ]; then
            echo "The release branch holds $released, not $version, so there is no build to tag."
            exit 1
          fi
          title=$(sed -n "s/^## \[$version\] — [0-9-]* — //p" CHANGELOG.md | head -n 1)
          git tag -a "$tag" -m "codebase-kg $version${title:+ — $title}" origin/release
          git push origin "$tag"
