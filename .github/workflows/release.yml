name: Release branch

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-branch
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the release branch without development files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B release
          git rm -r -q .codex .github .gitignore .claude-plugin/marketplace.json docs evals mcp/tests mcp/bench mcp/scripts
          git commit -q -m "Release build of ${GITHUB_SHA::7}"
          git push -f origin release
